spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./.localdb/course-platform-demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema-h2.sql
      data-locations: classpath:db/seed-h2.sql

demo:
  token-store: memory
