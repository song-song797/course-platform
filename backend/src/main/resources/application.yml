server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: course-platform-demo
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:course_platform_demo}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/seed.sql

mybatis:
  configuration:
    map-underscore-to-camel-case: true

demo:
  upload-dir: ${UPLOAD_DIR:uploads}
  token-prefix: ${TOKEN_PREFIX:course-platform-demo:token:}
  token-ttl-hours: ${TOKEN_TTL_HOURS:12}
  bulk-seed:
    enabled: true
    reset-before-seed: true
    random-seed: 20260317
    course-count: 15
    members-per-course: 20
    assignment-count: 48
    reviewing-assignment-count: 20
    closed-assignment-count: 10
    group-student-review-count: 10
    individual-student-review-count: 9
